name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install
          npm install firebase@10.12.2 @capacitor/cli@7.4.3

      - name: Prepare web app
        run: |
          rm -rf www
          mkdir -p www
          cp index.html manifest.webmanifest icon-192.png icon-512.png www/
          cp node_modules/firebase/firebase-app-compat.js www/
          cp node_modules/firebase/firebase-auth-compat.js www/
          cp node_modules/firebase/firebase-firestore-compat.js www/
          sed -i 's|https://www.gstatic.com/firebasejs/[^/]*/||g' www/index.html
          grep -q "firebase-app-compat.js" www/index.html || sed -i '0,/<script>/s|<script>|<script src="firebase-app-compat.js"></script>\n<script src="firebase-auth-compat.js"></script>\n<script src="firebase-firestore-compat.js"></script>\n<script>|' www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Ensure Android Internet Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$MANIFEST"

      - name: Sync app
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dira-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
