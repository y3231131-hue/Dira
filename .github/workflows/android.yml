name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install
          npm install firebase@10.12.2 @capacitor/cli@7.4.3

      - name: Save Firebase files to repo for website
        run: |
          cp node_modules/firebase/firebase-app-compat.js .
          cp node_modules/firebase/firebase-auth-compat.js .
          cp node_modules/firebase/firebase-firestore-compat.js .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add firebase-app-compat.js firebase-auth-compat.js firebase-firestore-compat.js
          git diff --staged --quiet || (git commit -m "Add local Firebase SDK files for website" && git push)

      - name: Prepare web app
        run: |
          rm -rf www
          mkdir -p www
          cp index.html manifest.webmanifest icon-192.png icon-512.png firebase-app-compat.js firebase-auth-compat.js firebase-firestore-compat.js www/

      - name: Create Android project
        run: npx cap add android

      - name: Ensure Android Internet Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$MANIFEST"

      - name: Sync app
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dira-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
