name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli@7.4.3

            - name: Prepare web app
        run: |
          rm -rf www
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
          curl -fL https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js -o www/firebase-app-compat.js
          curl -fL https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js -o www/firebase-auth-compat.js
          curl -fL https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js -o www/firebase-firestore-compat.js
      - name: Create Android project
        run: npx cap add android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />\n',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n',
          ]

          for permission in permissions:
              if permission.strip() not in manifest:
                  manifest = manifest.replace("<application", permission + "<application", 1)

          path.write_text(manifest)
          PY

      - name: Sync app
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dira-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
